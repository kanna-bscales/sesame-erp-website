<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Archivo;font-weight:100 900;font-stretch:62% 125%;src:url(archivo.woff2) format('woff2-variations');}
@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(plex-400.woff2);}
@font-face{font-family:"IBM Plex Sans";font-weight:500;src:url(plex-500.woff2);}
@font-face{font-family:"IBM Plex Sans";font-weight:600;src:url(plex-600.woff2);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:300px;overflow:hidden;background:#111214;font-family:"IBM Plex Sans",sans-serif;-webkit-font-smoothing:antialiased}
.card{position:absolute;inset:0;background:linear-gradient(180deg,#1c1d20 0%,#18191c 100%);border-top:1px solid #2a2b2f;padding:46px 40px 0}

.cols{margin-top:42px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}

 <h1>Business Scales LLC</h1>

  <div><p class="l">SesameERP</p><p class="v">www.sesameerp.ai</p></div>

 </div>
