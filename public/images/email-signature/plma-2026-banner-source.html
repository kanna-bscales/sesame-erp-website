<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Archivo;src:url(archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Plex;src:url(plex.woff2) format('woff2');font-weight:400 600}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:600px;height:170px;background:#fff}
.stage{position:relative;width:600px;height:170px;padding:10px 18px 18px 10px}
.copy{position:absolute;border-radius:6px}
.carbon{inset:22px 6px 6px 22px;background:#F6B8C4}
.canary{inset:16px 12px 12px 16px;background:#FFD84D}
.sheet{position:relative;height:100%;background:#fff;border:1px solid #D9D9DD;border-radius:6px;padding:16px 20px;display:flex;gap:18px;align-items:center;font-family:Plex,Arial,sans-serif;color:#16171B}
.left{flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:Archivo,Arial,sans-serif;font-variation-settings:"wdth" 112;font-weight:800;font-size:14px}
.pill{margin-left:auto;font-family:Plex,Arial,sans-serif;font-weight:600;font-size:10.5px;background:#EFEFF0;border-radius:99px;padding:3px 9px;display:inline-flex;align-items:center;gap:6px}
.pill i{width:6px;height:6px;border-radius:50%;background:#E50914;display:inline-block}
h1{margin-top:10px;font-family:Archivo,Arial,sans-serif;font-variation-settings:"wdth" 108;font-weight:800;font-size:20px;line-height:1.08;letter-spacing:-.01em}
.sub{margin-top:7px;font-size:13px;font-weight:600}
.sub span{background:linear-gradient(transparent 55%,#FFD84D 55%)}
.right{width:168px;text-align:center;border-left:1px solid #D9D9DD;padding-left:16px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.btn{display:block;background:#E50914;color:#fff;font-weight:600;font-size:13px;border-radius:8px;padding:10px 8px}
.url{margin-top:7px;font-size:10px;white-space:nowrap;color:#4D4F57}
</style></head><body><div class="stage">
<div class="copy carbon"></div><div class="copy canary"></div>
<div class="sheet">
 <div class="left">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#E50914"/><g fill="#fff"><ellipse cx="11" cy="11.5" rx="4.3" ry="2.3" transform="rotate(-32 11 11.5)"/><ellipse cx="16" cy="16" rx="4.3" ry="2.3" transform="rotate(-32 16 16)"/><ellipse cx="21" cy="20.5" rx="4.3" ry="2.3" transform="rotate(-32 21 20.5)"/></g></svg>SesameERP
   <span class="pill"><i></i>PLMA 2026 exclusive offer</span></div>
  <h1>Complimentary Development of One ERP Module</h1>
  <p class="sub"><span>US$5,000 Worth of ERP Development Work</span></p>
 </div>
 <div class="right"><span class="btn">Request yours</span><span class="url">sesameerp.ai/chicago-event</span></div>
</div></div></body></html>
